<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习平台｜把收藏变成知识树</title>
  <style>
    :root{--ink:#15221e;--paper:#f7f6f0;--line:#d9ded5;--muted:#718078;--lime:#c7ec62;--coral:#ee8e78}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:1480px;margin:auto;padding:0 34px 42px}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.brand{font:700 21px Georgia,"Songti SC",serif}.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--lime);margin-right:8px}.sync{margin-left:auto;color:var(--muted);font-size:13px}.dot{display:inline-block;width:7px;height:7px;background:var(--coral);border-radius:50%;margin-right:6px}button{font:inherit;cursor:pointer}.quiet{margin-left:12px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 12px;color:#42564d}.hero{display:flex;justify-content:space-between;gap:25px;padding:60px 0 35px}.eyebrow{font-size:12px;color:#557168;letter-spacing:.12em;font-weight:700}.hero h1{font:500 48px/1.1 Georgia,"Songti SC",serif;letter-spacing:-.04em;margin:11px 0}.hero em{font-style:normal;color:#58785c}.copy{color:var(--muted);font-size:15px}.add{align-self:end;border:0;border-radius:9px;background:var(--ink);box-shadow:0 2px #07100d;color:#fff;padding:12px 16px;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:27px}.stat{border:1px solid var(--line);background:#fbfaf6;border-radius:12px;padding:14px 17px;display:flex;justify-content:space-between;align-items:end;text-align:left;color:var(--muted)}.stat.active{background:#eaf4cb;border-color:#b6cb79}.stat b{font:400 28px Georgia,serif;color:var(--ink)}.stat span{font-size:13px}.work{display:grid;grid-template-columns:218px .93fr 1.25fr;min-height:635px;background:#fffdfa;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 16px 40px #2f3e3310}.tree,.list{padding:21px 15px;border-right:1px solid var(--line)}.head{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:bold;margin:0 8px 14px}.root,.leaf{display:block;border:0;width:100%;padding:8px 9px;border-radius:7px;background:transparent;text-align:left;color:#42564d}.root{font-weight:bold}.branch{margin:3px 0 10px}.leaves{padding-left:17px}.leaf{color:#6d7b73;font-size:13px}.leaf:before{content:'•';margin-right:9px;color:#a2afa8}.root.selected,.leaf.selected{background:#eaf3cf;color:#274438}.tip{border-top:1px dashed var(--line);padding:15px 8px;font-size:11px;line-height:1.6;color:#98a39d;margin-top:15px}.list{padding:23px 17px}.title p{font-size:12px;color:#7b887f;margin:0 0 4px}.title h2{font:500 22px Georgia,"Songti SC",serif;margin:0}.cards{display:grid;gap:9px;margin-top:22px}.card{width:100%;display:flex;gap:10px;text-align:left;padding:11px;border:1px solid #e5e7df;border-radius:11px;background:#fff}.card.selected{border-color:#9fb674;box-shadow:0 4px 14px #37543815}.thumb{width:36px;height:44px;flex:none;border-radius:7px;background:#dae9b4;display:grid;place-items:center;color:#36502e}.meta{display:flex;flex-direction:column;gap:5px;min-width:0}.meta b{font-size:13px;line-height:1.35}.meta small{font-size:11px;color:#8b968f}.tag{font-size:10px;color:#548148;background:#eaf5df;padding:3px 5px;width:max-content;border-radius:4px}.state{margin-left:auto;white-space:nowrap;font-size:10px;color:#77857c}.note{padding:28px 32px}.note-top{display:flex;justify-content:space-between}.source{font-size:11px;background:#edf3e7;color:#6b8076;padding:5px 8px;border-radius:5px}.archive{border:1px solid var(--line);background:transparent;border-radius:7px;font-size:12px;color:#42564d;padding:6px 9px}.note h2{font:500 30px/1.22 Georgia,"Songti SC",serif;letter-spacing:-.02em;margin:18px 0}.status{font-size:12px;color:#7e8b83;margin-bottom:17px}.status select{margin-left:9px;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fff;color:#405148}.block{border-top:1px solid #e8e9e3;padding:16px 0 3px}.block h3{font-size:12px;color:#52685d;margin:0 0 8px}.block p,.block li{font-size:13px;line-height:1.75;color:#405148;margin:0}.block.strong p{font-size:15px;color:#20362d}.block ol{margin:0;padding-left:22px}blockquote{margin:19px 0 0;padding:13px 15px;border-left:3px solid var(--coral);background:#fff7f3;color:#715348;font:15px/1.6 Georgia,"Songti SC",serif}.video{margin-top:20px;border:1px solid var(--line);border-radius:9px}.video summary{padding:12px 14px;font-size:13px;font-weight:bold;color:#42584e}.video div{height:170px;margin:0 12px 12px;border-radius:7px;background:#172820;color:#e8f0db;display:grid;place-items:center;font-size:12px}.modal{position:fixed;inset:0;background:#14231c77;display:none;place-items:center;padding:18px}.modal.show{display:grid}.dialog{position:relative;background:#fffdf8;border-radius:16px;width:min(410px,100%);padding:31px;text-align:center;box-shadow:0 20px 65px #0004}.dialog h2{font:500 25px Georgia,"Songti SC",serif;margin:0 0 10px}.dialog p{font-size:13px;color:#6f7d75;line-height:1.65}.dialog input{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}.close{position:absolute;right:12px;top:9px;border:0;background:none;font-size:22px;color:#77847d}@media(max-width:900px){.work{grid-template-columns:185px 1fr}.note{grid-column:1/-1;border-top:1px solid var(--line)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shell{padding:0 16px 28px}.sync{display:none}.hero{display:block;padding:39px 0 25px}.hero h1{font-size:34px}.add{margin-top:17px}.work{display:block}.tree,.list{border-right:0;border-bottom:1px solid var(--line)}.branch{display:inline-block;width:49%;vertical-align:top}.tip{display:none}.note{padding:24px 20px}.note h2{font-size:26px}}
  </style>
</head>
<body><main class="shell"><header class="top"><div class="brand"><span class="mark">✦</span>学习平台</div><div class="sync"><i class="dot"></i>每日整理 <b>待连接抖音</b></div><button class="quiet" onclick="connect()">连接抖音</button></header><section class="hero"><div><div class="eyebrow">你的私人知识树</div><h1>把收藏，变成<br><em>真正用得上的知识。</em></h1><div class="copy">先看整理好的笔记；觉得值得，再打开原视频深入学习。</div></div><button class="add" onclick="addOld()">＋ 加入一条旧收藏</button></section><section class="stats"><button class="stat active" onclick="filter('all',this)"><b>4</b><span>值得学习</span></button><button class="stat" onclick="filter('AI',this)"><b>2</b><span>AI 收藏</span></button><button class="stat" onclick="filter('逻辑表达',this)"><b>2</b><span>逻辑表达</span></button><button class="stat"><b>0</b><span>已归档</span></button></section><section class="work"><aside class="tree"><div class="head"><span>知识树</span><span>＋</span></div><button class="root selected" onclick="filter('all')">◈ 全部内容</button><div class="branch"><button class="root" onclick="filter('AI')">⌄ AI</button><div class="leaves"><button class="leaf" onclick="filter('数据分析')">数据分析</button><button class="leaf" onclick="filter('PPT 与汇报')">PPT 与汇报</button><button class="leaf">工作流与实操</button><button class="leaf">基础与趋势</button></div></div><div class="branch"><button class="root" onclick="filter('逻辑表达')">⌄ 逻辑表达</button><div class="leaves"><button class="leaf" onclick="filter('结构化表达')">结构化表达</button><button class="leaf" onclick="filter('沟通与说服')">沟通与说服</button><button class="leaf">演讲与汇报</button></div></div><p class="tip">按住分类即可调整位置<br>你也可以随时新增分支</p></aside><section class="list"><div class="title"><p id="crumb">你的学习资料库</p><h2 id="listTitle">值得投入时间的收藏</h2></div><div class="cards" id="cards"></div></section><article class="note" id="note"></article></section></main><div class="modal" id="modal"><section class="dialog"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle"></h2><p id="modalText"></p><input id="link" placeholder="粘贴抖音视频链接"><button class="add" onclick="closeModal()">加入待整理</button></section></div><script>
const data=[{t:'用 AI 把销售周报变成有结论的 PPT',cat:'AI',branch:'PPT 与汇报',min:8,s:'未看',why:'与你的销售数据分析和 PPT 制作直接相关，方法可立刻复用。',sum:'先让 AI 提取经营数据中的变化、异常和原因，再按“结论—证据—动作”生成三页汇报骨架。重点不是做得更花，而是让老板一眼看懂要做什么。',steps:['把本周数据表和指标口径整理成输入','要求 AI 先列出三个经营结论','用结论—证据—动作结构生成页面','人工核对数字和业务解释'],scene:'周报、月度经营复盘、销售例会汇报',q:'不要让 AI 替你做图，先让它替你找到结论。'},{t:'用 AI 做经营异常归因的提问框架',cat:'AI',branch:'数据分析',min:6,s:'值得反复看',why:'能提升你做运营分析时的归因质量，避免只停留在表面波动。',sum:'面对销售额或毛利异常，不直接问“为什么下降”，而是让 AI 按时间、区域、渠道、产品和客户层级拆解，并区分事实、假设和待验证信息。',steps:['先定义异常指标与对比周期','指定五个拆分维度','要求输出证据与待验证假设','把结论回填到数据中验证'],scene:'销量下滑、毛利异常、区域经营复盘',q:'先拆维度，再讲原因；先讲证据，再给判断。'},{t:'三句话说清楚一个分析结论',cat:'逻辑表达',branch:'结构化表达',min:4,s:'已实践',why:'直接改善你在经营会和 PPT 汇报中的表达效率。',sum:'用“结论是什么—为什么成立—下一步做什么”完成一次简短表达。先给答案，再给最关键的一到两条证据，最后落到行动。',steps:['先写一句结论','只保留两条最有力的证据','明确责任人和下一步动作'],scene:'临时汇报、会议发言、PPT 页标题',q:'结论先行，证据有限，动作明确。'},{t:'给业务方建议时，如何减少对方的抵触',cat:'逻辑表达',branch:'沟通与说服',min:7,s:'未看',why:'适合跨部门沟通和推动经营动作，能让数据结论更容易被采纳。',sum:'把“你应该做什么”改成“共同面对的目标—当前证据—可选方案”。用选择题代替命令句，先承认业务约束，再提出建议。',steps:['先对齐共同目标','展示与对方相关的证据','给出两种可执行方案','约定一个可复盘的验证点'],scene:'区域沟通、经营改进建议、跨部门协作',q:'建议不是结论的终点，而是让对方愿意行动的开始。'}];let active='all',selected=0;function render(){let arr=data.filter(x=>active==='all'||x.cat===active||x.branch===active);document.querySelector('#crumb').textContent=active==='all'?'你的学习资料库':active;document.querySelector('#listTitle').textContent=active==='all'?'值得投入时间的收藏':'这个分支的收藏';document.querySelector('#cards').innerHTML=arr.map(x=>{let i=data.indexOf(x);return `<button class="card ${i===selected?'selected':''}" onclick="choose(${i})"><span class="thumb">▶</span><span class="meta"><b>${x.t}</b><small>${x.cat} · ${x.branch} · ${x.min} 分钟</small><span class="tag">值得学习</span></span><span class="state">${x.s}</span></button>`}).join('');let x=data[selected];document.querySelector('#note').innerHTML=`<div class="note-top"><span class="source">抖音收藏 · ${x.cat}</span><button class="archive">归档</button></div><h2>${x.t}</h2><div class="status">学习状态 <select onchange="data[selected].s=this.value;render()"><option ${x.s==='未看'?'selected':''}>未看</option><option ${x.s==='已看'?'selected':''}>已看</option><option ${x.s==='已实践'?'selected':''}>已实践</option><option ${x.s==='值得反复看'?'selected':''}>值得反复看</option></select></div><section class="block"><h3>这条为什么值得学</h3><p>${x.why}</p></section><section class="block strong"><h3>三十秒摘要</h3><p>${x.sum}</p></section><section class="block"><h3>可以这样做</h3><ol>${x.steps.map(s=>'<li>'+s+'</li>').join('')}</ol></section><section class="block"><h3>适用场景</h3><p>${x.scene}</p></section><blockquote>“${x.q}”</blockquote><details class="video"><summary>展开原视频观看</summary><div>▶　原视频将在连接抖音后显示</div></details>`}function choose(i){selected=i;render()}function filter(v,b){active=v;let found=data.findIndex(x=>v==='all'||x.cat===v||x.branch===v);selected=found<0?0:found;document.querySelectorAll('.stat').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function openModal(title,text){modalTitle.textContent=title;modalText.textContent=text;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function connect(){openModal('连接你的抖音收藏','首次在你自己的浏览器完成登录后，学习平台会每天整理一次新增收藏。')}function addOld(){openModal('补录一条旧收藏','在抖音点“分享”后选择“加入学习树”，也可以在这里粘贴链接。')}render();
</script></body></html>
